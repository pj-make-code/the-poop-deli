<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>🚽 The Poop Deli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#2a1a0a;overflow:hidden;height:100vh;width:100vw;user-select:none}

/* ── TITLE ── */
#title-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a0f05;z-index:100}
.checkered-bg{position:absolute;inset:0;background-image:repeating-conic-gradient(#F5E6C8 0% 25%,#E8C97A 0% 50%);background-size:60px 60px;animation:scrollTiles 4s linear infinite;opacity:.25}
@keyframes scrollTiles{0%{background-position:0 0}100%{background-position:60px 60px}}
.title-content{position:relative;text-align:center;z-index:1}
.title-main{font-family:'Fredoka One',cursive;font-size:78px;color:#F5E6C8;text-shadow:6px 6px 0 #5c3008,-2px -2px 0 #5c3008;line-height:1;margin-bottom:8px}
.title-tagline{font-size:17px;color:#b08040;font-style:italic;margin-bottom:36px;opacity:.8}
.bouncing-poop{font-size:58px;animation:bouncePoop 1.2s ease-in-out infinite;display:inline-block;margin-bottom:16px}
@keyframes bouncePoop{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-20px) rotate(5deg)}}
.start-btn{font-family:'Fredoka One',cursive;font-size:26px;background:#F0A500;color:#1a0f05;border:none;padding:16px 44px;border-radius:50px;cursor:pointer;box-shadow:0 8px 0 #8B6000,0 10px 20px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s;letter-spacing:1px}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #8B6000,0 14px 20px rgba(0,0,0,.5)}
.start-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #8B6000}

/* ── GAME SCREEN ── */
#game-screen{display:none;position:fixed;inset:0;flex-direction:column;background:#F5E6C8}
#game-screen.active{display:flex}
#game-screen::before{content:'';position:absolute;inset:0;background-image:repeating-conic-gradient(#EDD98A 0% 25%,#F5E6C8 0% 50%);background-size:40px 40px;z-index:0;opacity:.45;pointer-events:none}

/* HEADER */
#game-header{position:relative;z-index:10;background:linear-gradient(180deg,#5c3008,#4a2506);color:#F5E6C8;display:flex;align-items:center;justify-content:space-around;padding:6px 20px;border-bottom:4px solid #F0A500;flex-shrink:0;height:54px}
.hdr{text-align:center}
.hdr-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.65;display:block}
.hdr-value{font-family:'Fredoka One',cursive;font-size:22px;color:#F0A500;display:block;line-height:1.1}
.strikes-row{display:flex;gap:4px;font-size:20px;justify-content:center}

/* MAIN GRID */
#game-main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:250px 1fr 210px;min-height:0;overflow:hidden}

/* LEFT: ORDERS */
#orders-panel{background:rgba(255,255,255,.12);border-right:3px solid #8B6914;display:flex;flex-direction:column;overflow:hidden}
#orders-panel h3{font-family:'Fredoka One',cursive;font-size:14px;color:#5c3008;padding:8px 10px 6px;border-bottom:2px solid #8B6914;background:rgba(240,165,0,.18);flex-shrink:0}
#orders-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.order-ticket{background:#FFF9F0;border:2px solid #c8a050;border-radius:6px;padding:8px;font-size:12px;box-shadow:2px 2px 6px rgba(0,0,0,.12);position:relative}
.ticket-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ticket-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0}
.ticket-name{font-weight:800;font-size:12px;color:#5c3008}
.ticket-items{list-style:none;font-family:'Courier New',monospace;font-size:11px;color:#333;margin-bottom:6px;line-height:1.55}
.ticket-timer-bar{height:5px;background:#e0c090;border-radius:3px;overflow:hidden;margin-bottom:3px}
.ticket-timer-fill{height:100%;background:linear-gradient(90deg,#2D6A3F,#4CAF50);border-radius:3px;transition:width .5s linear,background .5s}
.ticket-tip{font-size:11px;color:#8B6914;font-weight:800;text-align:right}
.order-ticket.expiring .ticket-timer-fill{background:linear-gradient(90deg,#CC3333,#FF5555)}

/* CENTER */
#center-panel{display:flex;flex-direction:column;overflow:hidden}

/* TOASTER STATION */
#toaster-station{background:rgba(139,105,20,.13);border-bottom:3px solid #8B6914;padding:10px 12px;flex-shrink:0}
#toaster-station h3{font-family:'Fredoka One',cursive;font-size:14px;color:#5c3008;margin-bottom:8px}
#toasters-row{display:flex;gap:10px;justify-content:center}
.toaster-slot{width:105px;height:92px;border:3px solid #8B6914;border-radius:10px;background:linear-gradient(180deg,#d4a030,#b07820);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.2);transition:transform .1s}
.toaster-slot:hover:not(.locked):not(.busy){transform:translateY(-2px)}
.toaster-slot.locked{background:linear-gradient(180deg,#888,#666);cursor:not-allowed;opacity:.65}
.toaster-slot.locked::after{content:'🔧 Out\nof Order';font-size:10px;color:#fff;text-align:center;white-space:pre;font-weight:800}
.toaster-slot.ready{animation:readyPulse .9s ease-in-out infinite;cursor:grab}
.toaster-slot.ready:active{cursor:grabbing}
@keyframes readyPulse{0%,100%{box-shadow:0 4px 8px rgba(0,0,0,.2),0 0 0 0 rgba(240,165,0,.7)}50%{box-shadow:0 4px 8px rgba(0,0,0,.2),0 0 0 9px rgba(240,165,0,0)}}
.toaster-icon{font-size:26px;margin-bottom:3px}
.toaster-prog-wrap{width:78%;height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;margin-top:3px}
.toaster-prog-fill{height:100%;background:linear-gradient(90deg,#F0A500,#FFD700);border-radius:3px;transition:width .3s linear}
.toaster-lbl{font-size:9px;color:rgba(255,255,255,.9);font-weight:800;margin-top:2px}

/* BREAD POPOVER */
.bread-popover{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#FFF9F0;border:3px solid #8B6914;border-radius:10px;padding:6px;z-index:999;box-shadow:0 8px 20px rgba(0,0,0,.35);white-space:nowrap;display:none}
.bread-popover.visible{display:block}
.bread-opt{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:#5c3008;transition:background .12s}
.bread-opt:hover{background:#F0A500;color:#1a0f05}

/* ASSEMBLY AREA */
#assembly-area{flex:1;padding:10px 12px;display:flex;flex-direction:column;min-height:0}
#assembly-area h3{font-family:'Fredoka One',cursive;font-size:14px;color:#5c3008;margin-bottom:8px;flex-shrink:0}
#plates-row{display:flex;gap:14px;justify-content:center;flex:1;align-items:center}
.plate-slot{width:155px;height:155px;border:3px dashed #8B6914;border-radius:50%;background:radial-gradient(circle,#FFF8EE 55%,#F0E0B0 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:border-color .2s,box-shadow .2s;overflow:visible}
.plate-slot.drag-over{border-color:#F0A500;box-shadow:0 4px 16px rgba(240,165,0,.45)}
.plate-empty-txt{font-size:11px;color:#b08040;font-weight:700;text-align:center;padding:16px;line-height:1.4}
.plate-sandwich{display:flex;flex-direction:column-reverse;align-items:center;width:100%;padding-bottom:8px;gap:0}
.sw-layer{border-radius:8px;display:flex;align-items:center;justify-content:center;animation:layerDrop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes layerDrop{0%{transform:translateY(-18px) scale(1.1);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sw-bread{width:118px;height:20px;background:linear-gradient(180deg,#D4A030,#c89020);border-radius:10px 10px 4px 4px;border:2px solid #8B6000}
.sw-bread-top{width:118px;height:20px;background:linear-gradient(180deg,#c89020,#D4A030);border-radius:4px 4px 10px 10px;border:2px solid #8B6000}
.sw-ham{width:108px;height:13px;background:#F4A0A0;border:1.5px solid #c07070;border-radius:6px}
.sw-cheese{width:108px;height:11px;background:#FFD050;border:1.5px solid #c8a000;border-radius:4px}
.sw-tomato{width:98px;height:10px;background:#E83030;border:1.5px solid #a02020;border-radius:50%}
.sw-lettuce{width:112px;height:11px;background:#4CAF50;border:1.5px solid #2D6A3F;border-radius:6px;clip-path:polygon(0% 50%,5% 0%,10% 50%,15% 0%,20% 50%,25% 0%,30% 50%,35% 0%,40% 50%,45% 0%,50% 50%,55% 0%,60% 50%,65% 0%,70% 50%,75% 0%,80% 50%,85% 0%,90% 50%,95% 0%,100% 50%,100% 100%,0% 100%)}
.sw-poop{width:44px;height:34px;display:flex;align-items:center;justify-content:center;font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));animation:poopWobble 2s ease-in-out infinite}
@keyframes poopWobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.plate-actions{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap;z-index:20}
.plate-btn{font-family:'Fredoka One',cursive;font-size:12px;padding:4px 11px;border:2px solid;border-radius:20px;cursor:pointer;transition:transform .1s}
.plate-btn:active{transform:scale(.95)}
.btn-serve{background:#2D6A3F;border-color:#1a4025;color:#fff}
.btn-trash{background:#CC3333;border-color:#881111;color:#fff}

/* SPLAT */
.splat-effect{position:absolute;pointer-events:none;z-index:100;font-size:46px;top:50%;left:50%;transform:translate(-50%,-50%);animation:splatAnim .5s ease-out forwards}
@keyframes splatAnim{0%{transform:translate(-50%,-50%) scale(0) rotate(0)}60%{transform:translate(-50%,-50%) scale(1.5) rotate(20deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.8) rotate(-10deg);opacity:0}}

/* RIGHT: CUSTOMER QUEUE */
#customer-queue{background:rgba(45,106,63,.08);border-left:3px solid #8B6914;display:flex;flex-direction:column;padding:8px;gap:8px;overflow-y:auto}
#customer-queue h3{font-family:'Fredoka One',cursive;font-size:14px;color:#5c3008;text-align:center;flex-shrink:0}
.customer-card{background:#fff;border:2px solid #c8a050;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;animation:slideInRight .4s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
@keyframes slideInRight{0%{transform:translateX(90px);opacity:0}100%{transform:translateX(0);opacity:1}}
.customer-card.leaving-happy{animation:leaveHappy .5s ease-in forwards}
@keyframes leaveHappy{0%{transform:scale(1);opacity:1}40%{transform:scale(1.15) rotate(5deg)}100%{transform:translateX(140px) scale(.4);opacity:0}}
.customer-card.leaving-angry{animation:leaveAngry .5s ease-in forwards}
@keyframes leaveAngry{0%,20%,40%,60%{transform:translateX(-6px)}10%,30%,50%{transform:translateX(6px)}100%{transform:translateX(140px);opacity:0}}
.cust-avatar{width:54px;height:54px}
.cust-name{font-size:11px;font-weight:800;color:#5c3008}
.patience-wrap{width:100%;height:7px;background:#e0c090;border-radius:4px;overflow:hidden}
.patience-fill{height:100%;border-radius:4px;transition:width .5s linear,background .5s}

/* INGREDIENT PANEL */
#ingredient-panel{position:relative;z-index:10;background:linear-gradient(180deg,#5c3008,#4a2506);border-top:4px solid #F0A500;padding:8px 20px;display:flex;gap:10px;justify-content:center;align-items:center;flex-shrink:0;height:84px}
.ing-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:2px solid rgba(240,165,0,.35);transition:background .15s,transform .1s;min-width:68px}
.ing-btn:hover{background:rgba(240,165,0,.18);border-color:#F0A500;transform:translateY(-2px)}
.ing-btn:active{cursor:grabbing}
.ing-icon{font-size:24px;pointer-events:none}
.ing-lbl{font-size:10px;font-weight:800;color:#F5E6C8;text-transform:uppercase;letter-spacing:.5px;pointer-events:none}

/* DRAG GHOST */
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;font-size:38px;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

/* END OF DAY */
#eod-screen{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,15,5,.95);z-index:100}
#eod-screen.active{display:flex}
.eod-card{background:#FFF9F0;border:4px solid #8B6914;border-radius:20px;padding:36px 56px;text-align:center;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.eod-title{font-family:'Fredoka One',cursive;font-size:40px;color:#5c3008;margin-bottom:4px}
.eod-quip{font-size:16px;color:#8B6914;font-style:italic;margin-bottom:26px}
.eod-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.eod-stat{background:#F5E6C8;border-radius:10px;padding:12px}
.eod-stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8B6914;font-weight:800}
.eod-stat-val{font-family:'Fredoka One',cursive;font-size:30px;color:#5c3008}
.next-btn{font-family:'Fredoka One',cursive;font-size:22px;background:#F0A500;color:#1a0f05;border:none;padding:12px 36px;border-radius:50px;cursor:pointer;box-shadow:0 6px 0 #8B6000;transition:transform .1s,box-shadow .1s}
.next-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8B6000}

/* TOAST */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:#5c3008;color:#F5E6C8;font-family:'Fredoka One',cursive;font-size:17px;padding:10px 22px;border-radius:28px;z-index:200;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;border:2px solid #F0A500;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#8B6914;border-radius:3px}
</style>
</head>
<body>
<div id="drag-ghost"></div>

<!-- TITLE -->
<div id="title-screen">
  <div class="checkered-bg"></div>
  <div class="title-content">
    <div class="bouncing-poop">💩</div>
    <h1 class="title-main">🚽 The Poop Deli</h1>
    <p class="title-tagline">Subway: Eat Shit</p>
    <button class="start-btn" onclick="startGame()">OPEN FOR BUSINESS</button>
  </div>
</div>

<!-- GAME -->
<div id="game-screen">
  <div id="game-header">
    <div class="hdr"><span class="hdr-label">Day</span><span class="hdr-value" id="h-day">1</span></div>
    <div class="hdr"><span class="hdr-label">Score</span><span class="hdr-value" id="h-score">0</span></div>
    <div class="hdr"><span class="hdr-label">Tips</span><span class="hdr-value" id="h-tips">$0</span></div>
    <div class="hdr"><span class="hdr-label">Lives</span><div class="strikes-row" id="h-strikes">❤️❤️❤️</div></div>
  </div>
  <div id="game-main">
    <div id="orders-panel">
      <h3>📋 Active Orders</h3>
      <div id="orders-list"></div>
    </div>
    <div id="center-panel">
      <div id="toaster-station">
        <h3>🍞 Toaster Station</h3>
        <div id="toasters-row"></div>
      </div>
      <div id="assembly-area">
        <h3>🍽️ Assembly Area</h3>
        <div id="plates-row"></div>
      </div>
    </div>
    <div id="customer-queue">
      <h3>👥 Queue</h3>
    </div>
  </div>
  <div id="ingredient-panel"></div>
</div>

<!-- END OF DAY -->
<div id="eod-screen">
  <div class="eod-card">
    <div class="eod-title" id="eod-title">Day 1 Complete</div>
    <div class="eod-quip" id="eod-quip"></div>
    <div class="eod-stats">
      <div class="eod-stat"><div class="eod-stat-lbl">Score</div><div class="eod-stat-val" id="eod-score">0</div></div>
      <div class="eod-stat"><div class="eod-stat-lbl">Tips</div><div class="eod-stat-val" id="eod-tips">$0</div></div>
      <div class="eod-stat"><div class="eod-stat-lbl">Served</div><div class="eod-stat-val" id="eod-served">0</div></div>
      <div class="eod-stat"><div class="eod-stat-lbl">Strikes</div><div class="eod-stat-val" id="eod-strikes">0</div></div>
    </div>
    <button class="next-btn" onclick="nextDay()">Next Day →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playDing() {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(880, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(1760, AC.currentTime + .1);
  g.gain.setValueAtTime(.35, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .5);
  o.start(); o.stop(AC.currentTime + .5);
}

function playSplat() {
  const n = AC.sampleRate * .28;
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 1.5);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 380;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(.55, AC.currentTime); s.start();
}

function playCash() {
  [[0,.2,1200],[.05,.18,1500],[.1,.16,1800],[.25,.22,900]].forEach(([t, vol, freq]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime+t);
    g.gain.linearRampToValueAtTime(vol, AC.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+t+.15);
    o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.2);
  });
}

function playBuzz() {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(120, AC.currentTime);
  o.frequency.linearRampToValueAtTime(70, AC.currentTime + .4);
  g.gain.setValueAtTime(.28, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .4);
  o.start(); o.stop(AC.currentTime + .4);
}

let jingleTimer = null, jinglePlaying = false;
function playJingle() {
  if (jinglePlaying) return;
  jinglePlaying = true;
  const notes = [523,659,784,659,784,1047,880,659,523,659,523];
  const dur = .17;
  notes.forEach((freq, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'triangle'; o.frequency.value = freq;
    const t = AC.currentTime + i * dur;
    g.gain.setValueAtTime(.14, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur*.85);
    o.start(t); o.stop(t + dur);
  });
  jingleTimer = setTimeout(() => {
    jinglePlaying = false;
    if (GS.screen === 'title') playJingle();
  }, notes.length * dur * 1000 + 700);
}
function stopJingle() { clearTimeout(jingleTimer); jinglePlaying = false; }

// ════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════
const BREADS = [
  {id:'wheat',    label:'Wheat Bread', emoji:'🌾'},
  {id:'rye',      label:'Rye Bread',   emoji:'🌀'},
  {id:'sourdough',label:'Sourdough',   emoji:'🍞'},
  {id:'wgrain',   label:'Whole Grain', emoji:'🌿'},
];
const TOPPINGS = [
  {id:'ham',     label:'Ham',     emoji:'🥩', cls:'sw-ham'},
  {id:'cheese',  label:'Cheese',  emoji:'🧀', cls:'sw-cheese'},
  {id:'tomato',  label:'Tomato',  emoji:'🍅', cls:'sw-tomato'},
  {id:'lettuce', label:'Lettuce', emoji:'🥬', cls:'sw-lettuce'},
  {id:'poop',    label:'Poop',    emoji:'💩', cls:'sw-poop'},
];
const EMAP = Object.fromEntries([...BREADS,...TOPPINGS].map(x=>[x.id,x.emoji]));
const TCLS  = Object.fromEntries(TOPPINGS.map(x=>[x.id,x.cls]));

const DAY_CFG = {
  1:{toasters:2,customers:6, patience:45,spawn:20},
  2:{toasters:2,customers:7, patience:40,spawn:18},
  3:{toasters:3,customers:8, patience:35,spawn:15},
  4:{toasters:3,customers:8, patience:35,spawn:13},
};
function dayCfg(d) {
  if (d >= 5) return {toasters:4, customers:Math.min(10+Math.floor((d-5)*.5),12), patience:30, spawn:10};
  return DAY_CFG[d] || DAY_CFG[4];
}

// Customer face SVG inner content
function face(skin, hair, mustache, longHair, blush) {
  const mst = mustache ? `<ellipse cx="24" cy="37" rx="7" ry="3" fill="${hair}" opacity=".85"/><ellipse cx="36" cy="37" rx="7" ry="3" fill="${hair}" opacity=".85"/>` : '';
  const h = longHair
    ? `<rect x="7" y="7" width="46" height="11" rx="6" fill="${hair}"/><rect x="5" y="13" width="9" height="28" rx="5" fill="${hair}"/><rect x="46" y="13" width="9" height="28" rx="5" fill="${hair}"/>`
    : `<rect x="7" y="7" width="46" height="12" rx="6" fill="${hair}"/>`;
  return `${h}
    <ellipse cx="30" cy="35" rx="20" ry="22" fill="${skin}"/>
    <circle cx="22" cy="30" r="4.5" fill="white"/><circle cx="38" cy="30" r="4.5" fill="white"/>
    <circle cx="23" cy="31" r="2.8" fill="#1a0f05"/><circle cx="39" cy="31" r="2.8" fill="#1a0f05"/>
    <circle cx="24" cy="30" r="1.1" fill="white"/><circle cx="40" cy="30" r="1.1" fill="white"/>
    ${mst}
    <path d="M21 43 Q30 50 39 43" stroke="${hair}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="19" cy="39" rx="5.5" ry="3" fill="${blush}" opacity=".35"/>
    <ellipse cx="41" cy="39" rx="5.5" ry="3" fill="${blush}" opacity=".35"/>`;
}

const CUSTOMERS = [
  {name:'Murray', svg: face('#E8A830','#5c3008',true, false,'#cc3333')},
  {name:'Doris',  svg: face('#FDBCB4','#330033',false,true, '#FF69B4')},
  {name:'Tyler',  svg: face('#90C8E0','#003060',false,false,'#1E90FF')},
  {name:'Gladys', svg: face('#B0D890','#1a4000',false,true, '#228B22')},
  {name:'Hank',   svg: face('#FFB870','#3a1a00',true, false,'#FF6600')},
  {name:'Priya',  svg: face('#DDA0DD','#220022',false,true, '#8B008B')},
];

const QUIPS = [
  '"Disgusting. Impressive."',
  '"Health inspector called. Again."',
  '"Zero FDA compliance. Full vibes."',
  '"Technically still open."',
  '"We run on violations and tips."',
  '"The poop sells itself."',
  '"Somehow nobody died."',
];

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let GS = { screen: 'title' };
let orderSeq = 1, custSeq = 1;
let spawnIv = null, loopIv = null, dayEnding = false;

function freshState(day, score, tips) {
  return {
    screen: 'game',
    day, score: score||0, tips: tips||0,
    strikes: 0,
    toasters: Array.from({length:4}, () => ({state:'empty',bread:null,progress:0,startAt:0,duration:0})),
    plates: [{bread:null,toppings:[]},{bread:null,toppings:[]},{bread:null,toppings:[]}],
    orders: [],
    customers: [],
    spawned: 0,
    servedToday: 0,
    doneToday: 0, // served + walked out
  };
}

// ════════════════════════════════════════════════
// ORDER GENERATION
// ════════════════════════════════════════════════
function makeOrder(custId) {
  const bread = BREADS[Math.floor(Math.random()*BREADS.length)].id;
  const wantPoop = Math.random() < .5;
  const pool = wantPoop ? TOPPINGS.map(t=>t.id) : TOPPINGS.filter(t=>t.id!=='poop').map(t=>t.id);
  const shuffled = [...pool].sort(()=>Math.random()-.5);
  let tops = shuffled.slice(0, Math.floor(Math.random()*3)+1);
  if (wantPoop && !tops.includes('poop')) tops[tops.length-1] = 'poop';
  return {id: orderSeq++, custId, bread, toppings: tops, startAt: Date.now(), patience: dayCfg(GS.day).patience};
}

// ════════════════════════════════════════════════
// CUSTOMER SPAWN
// ════════════════════════════════════════════════
function spawnCustomer() {
  const cfg = dayCfg(GS.day);
  if (GS.spawned >= cfg.customers) return;
  if (GS.customers.filter(c=>c.state==='waiting').length >= 4) return;
  const defIdx = Math.floor(Math.random()*CUSTOMERS.length);
  const id = custSeq++;
  GS.customers.push({id, defIdx, name:CUSTOMERS[defIdx].name, state:'waiting', arriveAt:Date.now()});
  GS.orders.push(makeOrder(id));
  GS.spawned++;
  renderQueue();
  renderOrders();
}

// ════════════════════════════════════════════════
// MATCHING
// ════════════════════════════════════════════════
function matchPlate(pIdx) {
  const p = GS.plates[pIdx];
  if (!p.bread) return -1;
  const ps = [...p.toppings].sort().join(',');
  let best = -1, earliest = Infinity;
  GS.orders.forEach((o, i) => {
    if (o.bread === p.bread && [...o.toppings].sort().join(',') === ps) {
      if (o.startAt < earliest) { earliest = o.startAt; best = i; }
    }
  });
  return best;
}

// ════════════════════════════════════════════════
// SERVE / STRIKE
// ════════════════════════════════════════════════
function attemptServe(pIdx) {
  const p = GS.plates[pIdx];
  if (!p.bread) { toast('Nothing on the plate!'); return; }
  const oIdx = matchPlate(pIdx);
  if (oIdx === -1) {
    strike('Wrong order!');
    return;
  }
  const order = GS.orders[oIdx];
  const tip = Math.max(5, 50 - Math.floor((Date.now()-order.startAt)/1000));
  GS.score += 100;
  GS.tips += tip;
  GS.servedToday++;
  GS.doneToday++;

  const cId = order.custId;
  GS.orders.splice(oIdx, 1);
  GS.plates[pIdx] = {bread:null, toppings:[]};

  // Happy customer exit
  const cidx = GS.customers.findIndex(c=>c.id===cId);
  if (cidx !== -1) {
    GS.customers[cidx].state = 'served';
    const card = document.getElementById('cust-'+cId);
    if (card) { card.classList.add('leaving-happy'); setTimeout(()=>{GS.customers=GS.customers.filter(c=>c.id!==cId); renderQueue();}, 520); }
  }

  playCash();
  toast(`+100 pts  +$${tip} tip 🎉`);
  updateHeader();
  renderOrders();
  renderPlates();
  checkDayEnd();
}

function trashPlate(pIdx) {
  GS.plates[pIdx] = {bread:null, toppings:[]};
  renderPlates();
}

function strike(reason) {
  if (dayEnding) return;
  GS.strikes++;
  playBuzz();
  updateStrikes();
  toast(`Strike! ${reason} ❌`);
  if (GS.strikes >= 3) setTimeout(endDay, 900);
}

// ════════════════════════════════════════════════
// GAME LOOP (runs every 400ms)
// ════════════════════════════════════════════════
function gameLoop() {
  const now = Date.now();

  // Update toasters
  let toasterDirty = false;
  GS.toasters.forEach((t, i) => {
    if (t.state !== 'toasting') return;
    const pct = Math.min(100, (now - t.startAt) / t.duration * 100);
    t.progress = pct;
    const fill = document.getElementById('tp-'+i);
    if (fill) fill.style.width = pct + '%';
    if (pct >= 100) { t.state = 'ready'; playDing(); toasterDirty = true; }
  });
  if (toasterDirty) renderToasters();

  // Update order timers / expiry
  const expired = [];
  GS.orders.forEach((o, i) => {
    const elapsed = (now - o.startAt) / 1000;
    const pct = Math.max(0, 1 - elapsed / o.patience);
    const pb = document.getElementById('pb-'+o.custId);
    if (pb) {
      pb.style.width = (pct*100) + '%';
      pb.style.background = pct > .6 ? '#4CAF50' : pct > .3 ? '#F0A500' : '#CC3333';
    }
    if (pct <= 0) expired.push(i);
  });

  // Process expired in reverse
  [...expired].reverse().forEach(i => {
    const o = GS.orders[i];
    const cIdx = GS.customers.findIndex(c=>c.id===o.custId);
    if (cIdx !== -1) {
      GS.customers[cIdx].state = 'leaving';
      const card = document.getElementById('cust-'+o.custId);
      if (card) { card.classList.add('leaving-angry'); setTimeout(()=>{GS.customers=GS.customers.filter(c=>c.id!==o.custId); renderQueue();}, 520); }
    }
    GS.orders.splice(i, 1);
    GS.doneToday++;
    strike('Customer walked out!');
  });

  renderOrders();
  checkDayEnd();
}

function checkDayEnd() {
  if (dayEnding) return;
  const cfg = dayCfg(GS.day);
  if (GS.doneToday >= cfg.customers) setTimeout(endDay, 1200);
}

// ════════════════════════════════════════════════
// DAY START / END
// ════════════════════════════════════════════════
function startDay() {
  dayEnding = false;
  const cfg = dayCfg(GS.day);
  spawnIv = setInterval(spawnCustomer, cfg.spawn * 1000);
  loopIv = setInterval(gameLoop, 400);
  setTimeout(spawnCustomer, 600); // first customer fast
}

function endDay() {
  if (dayEnding) return;
  dayEnding = true;
  clearInterval(spawnIv);
  clearInterval(loopIv);

  const bonus = GS.servedToday * 25;
  GS.score += bonus;

  document.getElementById('eod-title').textContent  = `Day ${GS.day} Complete`;
  document.getElementById('eod-quip').textContent   = QUIPS[Math.floor(Math.random()*QUIPS.length)];
  document.getElementById('eod-score').textContent  = GS.score;
  document.getElementById('eod-tips').textContent   = '$'+GS.tips;
  document.getElementById('eod-served').textContent = GS.servedToday;
  document.getElementById('eod-strikes').textContent= GS.strikes;

  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('eod-screen').classList.add('active');
}

function nextDay() {
  const newDay = GS.day + 1;
  GS = freshState(newDay, GS.score, GS.tips);
  document.getElementById('eod-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  initUI();
  startDay();
}

// ════════════════════════════════════════════════
// TOASTERS
// ════════════════════════════════════════════════
function renderToasters() {
  const cfg = dayCfg(GS.day);
  const row = document.getElementById('toasters-row');
  row.innerHTML = '';
  GS.toasters.forEach((t, i) => {
    const locked = i >= cfg.toasters;
    const div = document.createElement('div');
    div.id = 'ts-'+i;
    div.className = 'toaster-slot' + (locked?' locked':'') + (t.state==='ready'?' ready':'') + (t.state==='toasting'?' busy':'');

    if (!locked) {
      if (t.state === 'empty') {
        div.innerHTML = `<div class="toaster-icon" style="opacity:.45">🍞</div><div class="toaster-lbl">HOVER TO LOAD</div>`;
        div.addEventListener('mouseenter', () => openPopover(i, div));
        div.addEventListener('mouseleave', (e) => {
          if (!e.relatedTarget || !div.contains(e.relatedTarget)) schedHidePopover(div);
        });
      } else if (t.state === 'toasting') {
        const bd = BREADS.find(b=>b.id===t.bread);
        div.innerHTML = `<div class="toaster-icon">${bd.emoji}</div><div class="toaster-lbl">TOASTING...</div>
          <div class="toaster-prog-wrap"><div class="toaster-prog-fill" id="tp-${i}" style="width:${t.progress}%"></div></div>`;
      } else if (t.state === 'ready') {
        const bd = BREADS.find(b=>b.id===t.bread);
        div.innerHTML = `<div class="toaster-icon" style="filter:drop-shadow(0 0 7px #FFD700)">${bd.emoji}</div><div class="toaster-lbl" style="color:#FFD700">READY!</div>`;
        div.addEventListener('mousedown', e => dragToast(e, i));
      }
    }
    row.appendChild(div);
  });
}

function openPopover(idx, slotEl) {
  if (GS.toasters[idx].state !== 'empty') return;
  closeAllPopovers();
  const pop = document.createElement('div');
  pop.className = 'bread-popover visible';
  pop.id = 'pop-'+idx;
  BREADS.forEach(b => {
    const opt = document.createElement('div');
    opt.className = 'bread-opt';
    opt.innerHTML = `${b.emoji} ${b.label}`;
    opt.addEventListener('mousedown', e => { e.stopPropagation(); loadToaster(idx, b.id); closeAllPopovers(); });
    pop.appendChild(opt);
  });
  pop.addEventListener('mouseleave', () => schedHidePopover(slotEl));
  slotEl.appendChild(pop);
}

let hidePopTimer = null;
function schedHidePopover(slotEl) {
  hidePopTimer = setTimeout(() => {
    const pop = slotEl.querySelector('.bread-popover');
    if (pop && !pop.matches(':hover') && !slotEl.matches(':hover')) pop.remove();
  }, 200);
}
function closeAllPopovers() { document.querySelectorAll('.bread-popover').forEach(p=>p.remove()); }

function loadToaster(idx, breadId) {
  const t = GS.toasters[idx];
  t.state = 'toasting'; t.bread = breadId;
  t.progress = 0; t.startAt = Date.now();
  t.duration = 8000 + Math.random()*2000;
  renderToasters();
}

// ════════════════════════════════════════════════
// DRAG & DROP
// ════════════════════════════════════════════════
let drag = {active:false, type:null, data:null};
const ghost = document.getElementById('drag-ghost');

function dragToast(e, toasterIdx) {
  const t = GS.toasters[toasterIdx];
  if (t.state !== 'ready') return;
  e.preventDefault();
  drag = {active:true, type:'toast', data:toasterIdx};
  ghost.textContent = EMAP[t.bread];
  showGhost(e);
}

function dragIngredient(e, ingId) {
  e.preventDefault();
  drag = {active:true, type:'ingredient', data:ingId};
  ghost.textContent = EMAP[ingId];
  showGhost(e);
}

function showGhost(e) {
  ghost.style.display = 'block';
  ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px';
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onDrop);
}

function onMove(e) {
  if (!drag.active) return;
  ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px';
  GS.plates.forEach((_,i)=>{
    const el = document.getElementById('pl-'+i);
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.classList.toggle('drag-over', e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom);
  });
}

function onDrop(e) {
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('mouseup', onDrop);
  ghost.style.display = 'none';

  let target = -1;
  GS.plates.forEach((_,i)=>{
    const el = document.getElementById('pl-'+i);
    if (!el) return;
    el.classList.remove('drag-over');
    const r = el.getBoundingClientRect();
    if (e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom) target = i;
  });

  if (target === -1) { drag.active=false; return; }

  if (drag.type === 'toast') {
    const t = GS.toasters[drag.data];
    if (t.state === 'ready' && !GS.plates[target].bread) {
      GS.plates[target].bread = t.bread;
      GS.plates[target].toppings = [];
      t.state = 'empty'; t.bread = null; t.progress = 0;
      renderToasters();
      renderPlates();
    } else if (GS.plates[target].bread) {
      toast('Plate already has bread!');
    }
  } else if (drag.type === 'ingredient') {
    const p = GS.plates[target];
    if (!p.bread) { toast('Add bread to the plate first! 🍞'); }
    else if (p.toppings.includes(drag.data)) { toast('Already added!'); }
    else if (p.toppings.length >= 4) { toast('Max 4 toppings!'); }
    else {
      p.toppings.push(drag.data);
      if (drag.data === 'poop') { playSplat(); showSplat(target); }
      renderPlates();
    }
  }
  drag.active = false;
}

function showSplat(pIdx) {
  const el = document.getElementById('pl-'+pIdx);
  if (!el) return;
  const s = document.createElement('div');
  s.className = 'splat-effect'; s.textContent = '💩';
  el.appendChild(s);
  setTimeout(()=>s.remove(), 550);
}

// ════════════════════════════════════════════════
// RENDER PLATES
// ════════════════════════════════════════════════
function renderPlates() {
  GS.plates.forEach((p, i) => {
    const el = document.getElementById('pl-'+i);
    if (!el) return;
    if (!p.bread) {
      el.innerHTML = '<div class="plate-empty-txt">Drop toast<br>here</div>';
      el.classList.add('empty-plate');
    } else {
      el.classList.remove('empty-plate');
      const bd = BREADS.find(b=>b.id===p.bread);
      const topLayers = p.toppings.map(tid => {
        if (tid === 'poop') return `<div class="sw-layer sw-poop">💩</div>`;
        return `<div class="sw-layer ${TCLS[tid]}"></div>`;
      }).join('');
      el.innerHTML = `
        <div class="plate-sandwich">
          <div class="sw-layer sw-bread" title="${bd.label} bottom"></div>
          ${topLayers}
          <div class="sw-layer sw-bread-top" title="${bd.label} top"></div>
        </div>
        <div class="plate-actions">
          <button class="plate-btn btn-serve" onclick="attemptServe(${i})">✅ Serve</button>
          <button class="plate-btn btn-trash" onclick="trashPlate(${i})">🗑️ Trash</button>
        </div>`;
    }
  });
}

// ════════════════════════════════════════════════
// RENDER ORDERS
// ════════════════════════════════════════════════
function renderOrders() {
  const list = document.getElementById('orders-list');
  const existing = new Set([...list.querySelectorAll('.order-ticket')].map(el=>parseInt(el.dataset.id)));
  const current = new Set(GS.orders.map(o=>o.id));

  // Remove stale tickets
  [...list.querySelectorAll('.order-ticket')].forEach(el => {
    if (!current.has(parseInt(el.dataset.id))) el.remove();
  });

  // Add or update
  GS.orders.forEach(o => {
    const elapsed = (Date.now()-o.startAt)/1000;
    const pct = Math.max(0, 1 - elapsed/o.patience);
    const tip = Math.max(5, 50 - Math.floor(elapsed));
    const expiring = pct < .3;
    const cust = GS.customers.find(c=>c.id===o.custId);
    const def = cust ? CUSTOMERS[cust.defIdx] : CUSTOMERS[0];

    if (existing.has(o.id)) {
      // Just update timer bar + tip
      const el = document.getElementById('ot-'+o.id);
      if (!el) return;
      el.classList.toggle('expiring', expiring);
      const fill = el.querySelector('.ticket-timer-fill');
      if (fill) fill.style.width = (pct*100)+'%';
      const tipEl = el.querySelector('.ticket-tip');
      if (tipEl) tipEl.textContent = `Tip: $${tip}`;
    } else {
      // Build new ticket
      const bd = BREADS.find(b=>b.id===o.bread);
      const items = [
        `<li>${bd.emoji} ${bd.label}</li>`,
        ...o.toppings.map(tid=>{ const t=TOPPINGS.find(x=>x.id===tid); return `<li>${t.emoji} ${t.label}</li>`; })
      ].join('');
      const el = document.createElement('div');
      el.className = 'order-ticket' + (expiring?' expiring':'');
      el.id = 'ot-'+o.id; el.dataset.id = o.id;
      el.innerHTML = `
        <div class="ticket-header">
          <svg class="ticket-avatar" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${def.svg}</svg>
          <span class="ticket-name">${def.name}</span>
        </div>
        <ul class="ticket-items">${items}</ul>
        <div class="ticket-timer-bar"><div class="ticket-timer-fill" style="width:${pct*100}%"></div></div>
        <div class="ticket-tip">Tip: $${tip}</div>`;
      list.appendChild(el);
    }
  });
}

// ════════════════════════════════════════════════
// RENDER QUEUE
// ════════════════════════════════════════════════
function renderQueue() {
  const queue = document.getElementById('customer-queue');
  const waiting = GS.customers.filter(c=>c.state==='waiting');
  const existIds = new Set([...queue.querySelectorAll('.customer-card')].map(el=>parseInt(el.id.split('-')[1])));
  const wantIds = new Set(waiting.map(c=>c.id));

  // Add new
  waiting.forEach(c => {
    if (existIds.has(c.id)) return;
    const def = CUSTOMERS[c.defIdx];
    const cfg = dayCfg(GS.day);
    const pct = 100;
    const card = document.createElement('div');
    card.className = 'customer-card';
    card.id = 'cust-'+c.id;
    card.innerHTML = `
      <svg class="cust-avatar" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${def.svg}</svg>
      <div class="cust-name">${def.name}</div>
      <div class="patience-wrap"><div class="patience-fill" id="pb-${c.id}" style="width:${pct}%;background:#4CAF50"></div></div>`;
    queue.appendChild(card);
  });
}

// ════════════════════════════════════════════════
// HEADER / STRIKES
// ════════════════════════════════════════════════
function updateHeader() {
  document.getElementById('h-day').textContent   = GS.day;
  document.getElementById('h-score').textContent = GS.score;
  document.getElementById('h-tips').textContent  = '$'+GS.tips;
  updateStrikes();
}
function updateStrikes() {
  const rem = 3 - GS.strikes;
  document.getElementById('h-strikes').textContent = '❤️'.repeat(Math.max(0,rem)) + '🖤'.repeat(Math.min(3,GS.strikes));
}

// ════════════════════════════════════════════════
// TOAST NOTIFICATION
// ════════════════════════════════════════════════
let toastTm = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTm);
  toastTm = setTimeout(()=>el.classList.remove('show'), 2100);
}

// ════════════════════════════════════════════════
// UI INIT
// ════════════════════════════════════════════════
function initUI() {
  // Plates
  const row = document.getElementById('plates-row');

  GS.plates.forEach((_, i) => {
    const p = document.createElement('div');
    p.className = 'plate-slot'; p.id = 'pl-'+i;

  });

function startGame() {
  AC.resume();
  stopJingle();
  orderSeq = 1; custSeq = 1;
  GS = freshState(1);
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-screen').classList.add('active');
  initUI();
  startDay();
}

// Title screen jingle
window.addEventListener('load', () => {
  setTimeout(() => { AC.resume().then(playJingle); }, 600);
});
